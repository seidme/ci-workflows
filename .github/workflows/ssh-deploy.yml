name: Shared SSH Deploy

on:
  workflow_call:
    inputs:
      target:
        description: 'Optional deploy target passed to ci-deploy.sh (defaults to repository name)'
        required: false
        type: string
        default: ''
    secrets:
      SSH_HOST:
        required: true
      SSH_USERNAME:
        required: true
      SSH_PRIVATE_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ${{ github.repository }} via Native OpenSSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          trap 'rm -f ~/.ssh/id_deploy' EXIT
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          TARGET="${DEPLOY_TARGET:-${GITHUB_REPOSITORY#*/}}"
          ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            "${SSH_USERNAME}@${SSH_HOST}" "${TARGET}"
